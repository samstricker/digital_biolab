[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbiolab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.1.0",
    "nbformat>=5.10.4",
    "numpy>=2.3.5",
    "plotly>=6.5.0",
    "scipy>=1.16.3",
]


[dependency-groups]
dev = ["black>=25.11.0", "mypy>=1.18.2", "pylint>=4.0.3", "pytest>=9.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dbiolab*"]
namespaces = false
